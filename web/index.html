<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Аналитика продаж на вымышленных данных">
  <title>Аналитика продаж - pipisso Data Lab</title>
  <script>try { if (localStorage.getItem('data-lab-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}</script>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="./">pipisso <span>Data Lab</span></a>
      <div class="top-actions">
        <a href="https://github.com/badahyousr-collab/Data-Lab" target="_blank" rel="noopener noreferrer">GitHub</a>
        <button id="theme-toggle" class="text-button" type="button" aria-label="Включить тёмную тему">Тёмная тема</button>
      </div>
    </header>

    <main>
      <h1>Аналитика продаж</h1>
      <section class="filters" aria-label="Фильтры отчёта">
        <label>С даты<input id="from-date" type="date"></label>
        <label>По дату<input id="to-date" type="date"></label>
        <label>Категория<select id="category"><option value="">Все категории</option></select></label>
        <button id="reset" class="secondary-button" type="button">Сбросить</button>
      </section>
      <p id="filter-error" class="error" role="alert" hidden></p>

      <section class="metrics" aria-label="Показатели">
        <article class="metric"><span>Чистая выручка</span><strong id="revenue">-</strong></article>
        <article class="metric"><span>Средний чек</span><strong id="average">-</strong></article>
        <article class="metric"><span>Покупки</span><strong id="purchases">-</strong></article>
        <article class="metric"><span>Повторные покупатели</span><strong id="repeat">-</strong></article>
      </section>

      <section class="panels" aria-label="Графики">
        <article class="panel trend-panel" id="trend-panel">
          <div class="panel-heading">
            <h2>Динамика выручки</h2>
            <button id="expand-trend" class="text-button" type="button" aria-expanded="false" aria-controls="trend-chart">Развернуть график</button>
          </div>
          <div class="trend-controls">
            <label>Период графика
              <select id="trend-range">
                <option value="all">Весь период</option>
                <option value="30">Последние 30 дней</option>
                <option value="90">Последние 90 дней</option>
                <option value="custom">Выбрать даты</option>
              </select>
            </label>
            <div id="trend-custom" class="custom-dates" hidden>
              <label>С даты<input id="trend-from" type="date"></label>
              <label>По дату<input id="trend-to" type="date"></label>
            </div>
          </div>
          <p id="trend-error" class="error" role="alert" hidden></p>
          <div id="trend-chart" class="chart" role="img" aria-label="График выручки"></div>
        </article>
        <article class="panel products-panel">
          <h2>Популярные товары</h2>
          <div id="product-chart" class="product-chart"></div>
        </article>
      </section>
      <p id="load-error" class="error" role="alert" hidden></p>
    </main>
  </div>
</body>
</html>
