name: Tests
on:
  push:
  pull_request:
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild public data and compare it with the committed snapshot
        run: |
          python -m datalab.cli seed --output data/demo
          python -m datalab.cli load --input data/demo --database data/sales.db
          python -m datalab.cli export --database data/sales.db --output web/data.json
          git diff --exit-code -- web/data.json
      - name: Check browser script syntax
        run: node --check web/app.js
